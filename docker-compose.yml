services:
  backend:
    build: .
    container_name: twitch-exposure-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - .:/app/host_code  # Mount project root to allow git pull
      - /var/run/docker.sock:/var/run/docker.sock # Allow container to restart itself
    env_file:
      - .env
    restart: always

  frontend:
    build: ./frontend
    container_name: twitch-exposure-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
